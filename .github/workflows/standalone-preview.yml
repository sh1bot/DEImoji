name: Publish standalone ligature preview
on:
  push:
    branches: [main]
    paths:
      - 'experiments/emoji-lfsr/standalone-preview.html'
      - '.github/workflows/standalone-preview.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: '/experiments/emoji-lfsr/standalone-preview.html'
      - name: Preserve an already published complete font build
        id: existing
        run: |
          if curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/build.json?preview_check=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/existing-build.json" 2>/dev/null; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare embedded-font preview
        if: steps.existing.outputs.full != 'true'
        run: |
          mkdir -p _site
          cp experiments/emoji-lfsr/standalone-preview.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: steps.existing.outputs.full != 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.existing.outputs.full != 'true'
        with:
          path: _site/
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: steps.existing.outputs.full != 'true'
        id: deployment
