name: Build fonts and browser test page

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight cold build finish and seed the cache. Newer pending runs
# replace older pending runs and can then reuse the compiled artwork.
concurrency:
  group: font-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[preview only]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Only 3D prebuilt fonts use LFS; this job builds from 2D sources.
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /tests/
            /ligatures/
            /web/
            /colrv1/
            /2D/svg/
            /2D/png/128/
            /2D/fonts/LICENSE
            /third_party/
      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev imagemagick pngquant zopfli libharfbuzz-bin
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt 'fonttools[woff]'
      - name: Test grouping with HarfBuzz
        run: .venv/bin/python -m pytest tests/test_cluster_ligatures.py -q
      - name: Identify native artwork and compiler inputs
        id: native-key
        run: echo "key=$(.venv/bin/python web/cache_fonts.py key)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled artwork cache
        id: artwork-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.native-key.outputs.key }}
          path: |
            build/native-fonts/NotoColorEmoji.ttf
            build/native-fonts/Noto-COLRv1.ttf
            build/native-fonts/cache.json
      - name: Check cache or recover the matching published fonts
        id: native
        run: .venv/bin/python web/cache_fonts.py ready --key '${{ steps.native-key.outputs.key }}' --wait-for-published 600 >> "$GITHUB_OUTPUT"
      - name: Build bitmap fonts
        if: steps.native.outputs.ready != 'true'
        run: |
          source .venv/bin/activate
          # Preview builds retain the source pixels and skip PNG optimization.
          make -j "$(nproc)" OPTIMIZE_PNGS=0
          cp NotoColorEmoji.ttf NotoColorEmoji_WindowsCompatible.ttf 2D/fonts/
      - name: Build vector fonts
        if: steps.native.outputs.ready != 'true'
        run: |
          source .venv/bin/activate
          python colrv1_generate_configs.py
          pushd colrv1
          nanoemoji --noexec_ninja all.toml
          ninja -C build -j "$(nproc)"
          popd
          cp colrv1/build/NotoColorEmoji.ttf 2D/fonts/Noto-COLRv1.ttf
          python colrv1_postproc.py 2D/fonts/Noto-COLRv1.ttf
      - name: Record native cache checksums
        if: steps.native.outputs.ready != 'true'
        run: .venv/bin/python web/cache_fonts.py stamp --key '${{ steps.native-key.outputs.key }}'
      - name: Save compiled artwork cache
        if: steps.artwork-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.native-key.outputs.key }}
          path: |
            build/native-fonts/NotoColorEmoji.ttf
            build/native-fonts/Noto-COLRv1.ttf
            build/native-fonts/cache.json
      - name: Apply current cluster rules to cached artwork
        run: .venv/bin/python web/cache_fonts.py apply --key '${{ steps.native-key.outputs.key }}'
      - name: Package matching fonts and test page
        env:
          DEIMOJI_NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: .venv/bin/python web/package.py --output build/site
      - name: Check the built fonts in Chromium
        run: |
          .venv/bin/pip install playwright
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python web/check_browser.py build/site
      - name: Keep downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEImoji-${{ github.sha }}
          path: build/site/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/site/

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.latest.outputs.current == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Publish matching test page and fonts
        if: steps.latest.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
